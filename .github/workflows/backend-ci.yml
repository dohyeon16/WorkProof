name: WorkProof Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "mobile/backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "mobile/backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/backend
    # 앱 import / pytest 에 필요한 비-비밀 CI 값. SESSION_SIGNING_SECRET 은 실제
    # 시크릿이 아니라 설정 로드용 더미다. DATABASE_URL 은 여기에 두지 않는다 —
    # pytest 의 db-health 테스트가 URL 이 있으면 실제 접속을 시도하므로, offline
    # 검증 단계에만 국한한다(실제 PostgreSQL 미접속 보장).
    env:
      ENVIRONMENT: test
      LOG_LEVEL: INFO
      SESSION_SIGNING_SECRET: ci-test-signing-secret-not-a-real-secret
      # alembic.ini 에 한글 주석이 있어 configparser 가 encoding="locale" 로 읽는다.
      # 러너 로케일을 UTF-8 로 고정해 인코딩 모호성을 제거한다(기능 코드 무변경).
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            mobile/backend/requirements.txt
            mobile/backend/requirements-dev.txt

      - name: Print Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dev requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall app main.py

      - name: Run tests
        run: pytest -q

      - name: FastAPI import
        run: python -c "from main import app; print(app.title)"

      - name: Alembic heads
        run: alembic heads

      # offline(--sql) 전용 placeholder URL. 이 단계는 DB 에 접속하지 않고
      # 방언 렌더링만 한다. 실제 서버/시크릿 아님.
      - name: Alembic offline SQL
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost/workproof_ci
        run: |
          alembic upgrade head --sql > /tmp/workproof-alembic.sql
          test -s /tmp/workproof-alembic.sql
          echo "offline SQL generated ($(wc -l < /tmp/workproof-alembic.sql) lines)"

  # Phase 2: 실제 PostgreSQL 대상 검증(마이그레이션 실행 + 인증 통합 테스트).
  # 운영 DB/시크릿과 완전히 분리 — CI 전용 placeholder 자격증명만 쓰고, 컨테이너는
  # job 종료 시 폐기된다. 배포 단계는 없다.
  backend-auth-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workproof_ci
          POSTGRES_PASSWORD: ci-not-a-real-secret
          POSTGRES_DB: workproof_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workproof_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      LOG_LEVEL: INFO
      # 설정 로드/토큰용 CI 더미(실제 시크릿 아님). SESSION_SIGNING_SECRET 과
      # JWT_SECRET_KEY 는 반드시 분리된 값.
      SESSION_SIGNING_SECRET: ci-test-signing-secret-not-a-real-secret
      JWT_SECRET_KEY: ci-test-jwt-secret-not-a-real-value-0123456789
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            mobile/backend/requirements.txt
            mobile/backend/requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dev requirements
        run: python -m pip install -r requirements-dev.txt

      # 실제 PostgreSQL 에 마이그레이션을 올렸다 내려 upgrade/downgrade 를 검증한다.
      - name: Alembic upgrade + downgrade on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://workproof_ci:ci-not-a-real-secret@localhost:5432/workproof_ci
        run: |
          alembic upgrade head
          alembic downgrade base

      # 인증 통합 테스트를 실제 PostgreSQL 대상으로 실행(부분 unique 등 PG 제약 강제).
      # TEST_DATABASE_URL 만 준다 — DATABASE_URL 은 주지 않아 health-db 계약도 유지.
      - name: Integration auth tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://workproof_ci:ci-not-a-real-secret@localhost:5432/workproof_ci
        run: pytest -q
