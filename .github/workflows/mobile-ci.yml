name: WorkProof Mobile CI

on:
  # base 브랜치로 필터하지 않는다 — 이 필터의 유일한 효과는 CI를 "제외"하는 것이고,
  # 제외될 때 아무 신호도 남지 않는다. stacked PR(#7~#19)이 다른 feature 브랜치를
  # base로 두는 바람에 Mobile CI가 8월 내내 한 번도 돌지 않았고, Node 20/test glob
  # 비호환이 그동안 드러나지 않았다.
  pull_request:
  push:
    branches: [main]
  # close/reopen 없이 CI를 다시 돌릴 수 있는 경로 (backend-ci.yml 과 동일).
  workflow_dispatch:

jobs:
  typecheck-test-web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "true"
      # CI 전용 무해한 placeholder 값 — 실제 키/Secret 아님, 인증 API 호출 없음.
      # 웹 번들 시 EXPO_PUBLIC_* 가 undefined 가 되어 크래시하는 것을 예방하는 용도.
      EXPO_PUBLIC_AUTH_API_URL: "https://example.invalid"
      EXPO_PUBLIC_GEMINI_API_KEY: "ci-placeholder"
      EXPO_PUBLIC_GOOGLE_VISION_API_KEY: "ci-placeholder"
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: "ci-placeholder"
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: "ci-placeholder"
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: "ci-placeholder"
      EXPO_PUBLIC_KAKAO_CLIENT_ID: "ci-placeholder"
      EXPO_PUBLIC_KAKAO_CLIENT_SECRET: "ci-placeholder"
      EXPO_PUBLIC_KAKAO_JS_KEY: "ci-placeholder"
      EXPO_PUBLIC_KAKAO_NATIVE_APP_KEY: "ci-placeholder"
      EXPO_PUBLIC_NAVER_CLIENT_ID: "ci-placeholder"
      EXPO_PUBLIC_NAVER_CLIENT_SECRET: "ci-placeholder"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Export web bundle
        run: npx expo export --platform web
